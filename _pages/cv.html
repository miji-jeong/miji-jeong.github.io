{% include base_path %}

<div class="cv-viewer" id="cv-viewer" data-pdf="{{ base_path }}/files/cv.pdf" hidden>
  <div class="cv-viewer__stage">
    <canvas id="cv-canvas" aria-label="A page of the CV"></canvas>
  </div>

  <div class="cv-viewer__bar">
    <button type="button" id="cv-prev" class="cv-viewer__btn">&#8592;&nbsp;Previous</button>
    <span id="cv-pageinfo" class="cv-viewer__count" aria-live="polite"></span>
    <button type="button" id="cv-next" class="cv-viewer__btn">Next&nbsp;&#8594;</button>
  </div>

  <p class="cv-viewer__hint">Use the arrow keys to turn pages.</p>
</div>

<p class="cv-viewer__download"><a href="{{ base_path }}/files/cv.pdf">Download my CV (PDF)</a></p>

<p id="cv-fallback" class="cv-viewer__fallback">
  Loading the CV&hellip; if nothing appears, <a href="{{ base_path }}/files/cv.pdf">open the PDF directly</a>.
</p>

<script type="module" src="{{ base_path }}/assets/js/cv-viewer.js"></script>
